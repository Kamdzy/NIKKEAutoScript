name: Sync Fork with Upstream

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/megumiss/NIKKEAutoScript.git || true
          git fetch upstream --tags

      - name: Sync master branch
        id: sync
        run: |
          git checkout master
          git merge upstream/master --no-edit || {
            echo "Merge conflict detected."
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "conflict=false" >> $GITHUB_OUTPUT

      - name: Push changes
        if: steps.sync.outputs.conflict == 'false'
        run: |
          git push origin master

      # Kamdzy - retag upstream releases at our merge HEAD, not verbatim.
      #
      # An upstream release tag (e.g. v1.1.0) points at upstream's version-bump
      # commit, which by construction predates every Kamdzy merge and contains
      # zero Kamdzy patches in its tree. The old sync step ran `git push origin
      # --tags`, which propagated those upstream tags verbatim to Kamdzy — and
      # every release the fork has shipped (v1.0.3..v1.0.5) turned out to be an
      # upstream-clean 7z under a Kamdzy label. Users downloading from the
      # Kamdzy Releases page got zero en-US patches.
      #
      # The fix: for the newest upstream vX.Y.Z tag newer than anything
      # mirrored to Kamdzy in any form (raw name or a -kamdzy.N variant), cut
      # a Kamdzy-suffixed tag on the CURRENT HEAD (the sync merge commit, which
      # includes both upstream's release commit and all Kamdzy patches merged
      # on top). Historical raw tags on origin are left alone — that ship
      # already sailed and rewriting them would surprise anyone who fetched.
      #
      # `git push origin --tags` is deliberately gone. The only thing this step
      # pushes is the Kamdzy-suffixed tag it just created — the raw upstream
      # tag stays local, and never lands on Kamdzy where build.yml would pick
      # it up.
      - name: Retag new upstream releases as Kamdzy variants
        if: steps.sync.outputs.conflict == 'false'
        env:
          # Kamdzy - push the new tag with a PAT (secret KAMDZY_RELEASE_PAT)
          # rather than the workflow's default GITHUB_TOKEN. GitHub Actions
          # deliberately does not fire `push: tags` triggers on refs pushed
          # by GITHUB_TOKEN — otherwise a workflow could loop by pushing tags
          # that re-run itself. So a GITHUB_TOKEN tag push here creates the
          # tag on origin but silently does not trigger build.yml. Using a
          # PAT sidesteps that; the tag push looks like a normal user push
          # and build.yml runs end-to-end without a follow-up dispatch.
          #
          # Secret setup: create a fine-grained PAT scoped to this repo with
          # `Contents: write` and `Metadata: read`, then Settings → Secrets
          # and variables → Actions → New repository secret named
          # KAMDZY_RELEASE_PAT. If the secret is missing this step still runs
          # but the tag push falls through to the default GITHUB_TOKEN, which
          # cuts the tag without firing build.yml — no data loss, just no
          # auto-build until the secret is added.
          KAMDZY_RELEASE_PAT: ${{ secrets.KAMDZY_RELEASE_PAT }}
        run: |
          set -euo pipefail
          # Ensure we have all of origin's tags to compare against
          git fetch origin --tags --force

          # Reconfigure origin to push tags with the PAT if available. Master
          # was already pushed above by the prior step using GITHUB_TOKEN;
          # only the tag push here needs the elevated credential.
          if [ -n "${KAMDZY_RELEASE_PAT:-}" ]; then
            # Kamdzy - actions/checkout persists GITHUB_TOKEN as an
            # `AUTHORIZATION: basic` extraheader, which git sends instead of
            # the PAT in the URL. v1.1.3-kamdzy.1 was pushed that way and
            # build.yml never fired. Drop the header so the PAT is used.
            if git config --local --get-all http.https://github.com/.extraheader >/dev/null; then
              git config --local --unset-all http.https://github.com/.extraheader
            fi
            git remote set-url origin \
              "https://x-access-token:${KAMDZY_RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}"
            echo "tag-push credential: KAMDZY_RELEASE_PAT (will trigger build.yml)"
          else
            echo "tag-push credential: GITHUB_TOKEN fallback (build.yml will NOT auto-trigger)"
          fi

          # Kamdzy - cut ONE tag per sync: the newest merged upstream version
          # newer than anything origin has shipped. Every Kamdzy tag is cut on
          # the same HEAD, so when several upstream releases land between two
          # successful syncs (e.g. a week of conflict failures), tagging each
          # would build identical trees under different labels -- a release
          # named v1.1.1-kamdzy.1 carrying 1.1.3 code, racing the real one for
          # "Latest". Older versions are superseded, never cut later.
          #
          # Newest version origin has shipped, raw (historical) or -kamdzy.N.
          shipped=$(git ls-remote --tags origin \
            | sed -nE 's#.*refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)(-kamdzy\.[0-9]+)?$#\1#p' \
            | sort -uV | tail -n1)
          echo "newest version on origin: ${shipped:-none}"

          # Semver-shaped upstream tags whose commit is in our merged history
          # and that are newer than $shipped. `|| true` keeps `set -e` from
          # tripping when grep finds nothing.
          candidates=()
          for tag in $(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true); do
            if ! git merge-base --is-ancestor "$(git rev-parse "$tag^{commit}")" HEAD; then
              echo "skip $tag: upstream commit is not in our merged history"
            elif [ -n "$shipped" ] && [ "$(printf '%s\n%s\n' "$tag" "$shipped" | sort -V | tail -n1)" = "$shipped" ]; then
              echo "skip $tag: not newer than $shipped"
            else
              candidates+=("$tag")
            fi
          done

          if [ ${#candidates[@]} -eq 0 ]; then
            echo "nothing to release"
            exit 0
          fi
          tag=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n1)
          if [ ${#candidates[@]} -gt 1 ]; then
            echo "superseded, not cut: $(printf '%s\n' "${candidates[@]}" | grep -vx "$tag" | tr '\n' ' ')"
          fi

          new_tag="${tag}-kamdzy.1"
          echo "cutting $new_tag at $(git rev-parse HEAD) (upstream $tag was $(git rev-parse "$tag^{commit}"))"
          git tag -a "$new_tag" -m "Kamdzy release built from upstream $tag on merge commit $(git rev-parse --short HEAD)"
          git push origin "refs/tags/$new_tag"

      # Kamdzy - build the payload with jq and fail on HTTP errors. The old
      # hand-quoted JSON pasted the multi-line commit list raw into a string,
      # so Discord rejected every alert ("The request body contains invalid
      # JSON.", code 50109) while plain curl exited 0 and the step stayed
      # green -- a week of conflict failures (2026-09-25..10-02) went unnoticed.
      - name: Send Discord notification on conflict
        if: failure() && steps.sync.outputs.conflict == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Kamdzy - `git log -n 5`, not `| head -5`: head exits early, git log
          # takes SIGPIPE, and under pipefail the step died with exit 141
          # before curl ran (the 2026-10-09 conflict alert was never sent).
          UPSTREAM_COMMITS=$(git log -n 5 HEAD..upstream/master --oneline --no-decorate)
          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg run_url "$RUN_URL" \
            --arg commits "$UPSTREAM_COMMITS" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: "⚠️ Fork Sync Conflict Detected",
              description: "Failed to automatically sync fork with upstream megumiss/NIKKEAutoScript due to merge conflicts.",
              color: 15158332,
              fields: [
                {name: "Repository", value: "[\($repo)](https://github.com/\($repo))", inline: true},
                {name: "Workflow Run", value: "[View Details](\($run_url))", inline: true},
                {name: "Action Required", value: "Manual merge required. Please resolve conflicts locally and push to master.", inline: false},
                {name: "Recent Upstream Commits", value: "```\n\($commits)\n```", inline: false}
              ],
              timestamp: $ts
            }]}')
          curl --fail-with-body -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
