# Announcement list; new announcements are appended to the top of the file
# Kamdzy - translated to English for en-US NKAS fork
- id: notice_20260822
  date: 2026-08-22
  title: Schedule settings (BETA)
  type: info
  content: |
    <b>New Schedule Settings page — manage every task's run time and enabled state in one place</b>
    Entry point: left task rail → Schedule settings (BETA).

    <b>What it does</b>
    Central view / editor for each task's schedule (daily / weekly / monthly), run time, and enabled toggle. Tick multiple tasks to batch-set their period and time; click a task name to jump straight to its settings page.

    <b>Recommended usage</b>
    Keep daily tasks on the same run time so they execute in priority order once the time hits. Splitting them across different times reorders execution and can miss reward windows; only add extra times for tasks you genuinely need to run multiple times per day.

    <b>Notes</b>
    This feature is in BETA; report any issues on <a href="https://github.com/megumiss/NIKKEAutoScript/issues" target="_blank">GitHub Issues</a>.
- id: notice_20260819
  date: 2026-08-19
  title: LiPass auto-login for Cookie retrieval
  type: info
  content: |
    <b>LiPass Cookie now supports one-click auto-login</b>
    No need to copy the Cookie manually: LiPass → Cookie → click "One-click login". The script performs the login automatically and fills in Cookie, XCommonParams and the Cookie expiry time for you.

    <b>Before you start</b>
    In NKAS Settings → Account Settings, fill in your LiPass account and password.

    <b>Notes</b>
    If a slider CAPTCHA appears during login, just drag across the image in the popup to solve it. On first use, playwright is installed automatically; if the machine has no Chrome/Edge, chromium is downloaded automatically. This also works inside Docker.
- id: notice_20260816
  date: 2026-08-16
  title: LiPass Cookie auto-renewal
  type: info
  content: |
    <b>LiPass Cookie now supports auto-renewal</b>
    Tasks renew the Cookie automatically before it expires — no manual refresh required.

    <b>How to enable</b>
    LiPass → Cookie → tick "Auto-renew (BETA)", and in NKAS Settings → Account Settings fill in your LiPass account (account only, no password needed).

    <b>Notes</b>
    Once the Cookie has actually expired it cannot be renewed, so keep tasks running normally. The first renewal installs playwright automatically; Docker users will additionally download chromium.
