- id: notice_20260923
  date: 2026-09-23
  title: OCR now supports GPU acceleration
  type: info
  content: |
    <b>PaddleOCR now supports NVIDIA GPU acceleration</b>

    <b>How to use</b>
    1. Go to NKAS → Deploy and set OcrDevice to gpu;
    2. Fully exit and reopen nkas.exe — the launcher switches the paddle package to the GPU build automatically (about 2–3 GB, please be patient);
    3. Restarting from inside the web UI is not enough; the program must be fully exited and started again.

    <b>Requirements</b>
    An NVIDIA GPU with a driver supporting CUDA >= 11.8. The CUDA variant (PaddleCuda) defaults to auto-detection; RTX 50-series cards should use cu129, and cu126 / cu118 can also be set manually.

    <b>Notes</b>
    1. If you don't have an NVIDIA card or aren't sure, keep cpu — the default cpu works fine;
    2. If GPU turns out to be unavailable after enabling it, the launcher stops before OCR initialises and tells you; switch back to cpu or reinstall the dependencies as instructed.
- id: notice_20260918
  date: 2026-09-18
  title: New virtual mouse control scheme
  type: info
  pinned: true
  content: |
    <b>The PC client adds a driver control scheme — mouse input is sent at the driver level by a virtual mouse driver</b>
    The game's anti-cheat has been upgraded and the previous control schemes, pyautogui and postmessage, are now blocked.
    The new driver scheme only supports foreground operation; it cannot be used while the game window is not in the foreground.

    <b>How to use</b>
    1. Install the driver — either way works:
    - Click Install under "Tools → Virtual mouse driver";
    - Install the latest <a href="https://www.logitechg.com/en-us/software/ghub" target="_blank">GHUB</a>. If GHUB is already installed, check under "Tools → Virtual mouse driver" that the status shows "Installed".
    2. Go to NKAS → PC Client → PC Client Settings and set "Mouse Control Scheme" to driver.

    <b>FAQ</b>
    1. Error "Virtual mouse driver move": first try changing "Mouse Move Method" to cursor. If that doesn't fix it, reinstall: uninstall the virtual mouse driver under Tools, restart the PC, then install it again.
    2. Error "Driver installer ran but no device was detected afterwards": restart the PC, uninstall the virtual mouse driver, restart again, then reinstall the virtual mouse driver; or simply uninstall GHUB, restart, and reinstall GHUB.

    <b style="color:var(--red)">Warning</b>
    <span style="color:var(--red)">This scheme has not been widely tested and may still be detected by anti-cheat, leading to warnings or bans.</span>
- id: notice_20260922
  date: 2026-09-22
  title: "New option for 1080p screens: VDD virtual display"
  type: info
  content: |
    <b>1080p users no longer need "Rotate Screen" — running the script on a VDD virtual display is now recommended</b>
    A virtual display driver creates a 1080x1920 virtual screen on your system. The game window runs in portrait on that virtual screen, your main display is completely unaffected, and the virtual screen can be switched off automatically when the task finishes.

    <b>How to use (ParsecVDD, recommended)</b>
    1. Install the official ParsecVDD driver: <a href="https://github.com/nomi-san/parsec-vdd/releases/download/v0.45.1/ParsecVDisplay-v0.45-setup.exe" target="_blank">ParsecVDisplay-v0.45-setup.exe</a>
    2. Go to NKAS → PC Client → Virtual Display and turn on "Enable VDD Virtual Display" (this turns on Multi-Screen Mode automatically), then set "Virtual Display Type" to ParsecVDD;
    3. Keep "Auto-Manage VDD Screen" on (the default): when a task starts, the virtual screen is created, corrected to 1080x1920 portrait and its screen number located automatically, and it is closed when the task ends — no need to set the resolution or target screen by hand.

    <b>MttVDD (legacy option)</b>
    1. Install the official MttVDD driver: <a href="https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.5.2/Virtual.Display.Driver-v25.05.03-setup-x64.exe" target="_blank">Virtual.Display.Driver-v25.05.03-setup-x64.exe</a>
    2. After installing the driver, open Windows display settings, select the new screen that appears, and set its resolution to 1920x1080 in portrait;
    3. Set "Virtual Display Type" to MttVDD; everything else is the same as above.

    <b>Notes</b>
    - With "Enable VDD Virtual Display" on, "Game Window Target Screen" doesn't need to be chosen manually — the screen number is located when the task starts;
    - The "Enable virtual display / Disable virtual display" buttons under manual VDD screen management are for testing whether the driver works, or for controlling the screen yourself when auto-management doesn't take effect; the "Virtual display driver status" next to them shows the driver installation and screen state;
    - The "Rotate Screen" option previously enabled for 1080p can now be turned off.
- id: notice_20260917
  date: 2026-09-17
  title: Random click-position offset added
  type: info
  content: |
    <b>Regular button clicks now apply a random coordinate offset</b>
    On by default, with a 5-pixel offset.

    <b>Where to set it</b>
    NKAS → Optimization Settings → Random click offset; enter a pixel value.

    <b>Notes</b>
    Some pages may not be clicked correctly in the current version; set "Random click offset" to 0 to disable the offset.
- id: notice_20260903
  date: 2026-09-03
  title: Background-mode swipe issues fixed
  type: info
  content: |
    <b>Background-mode swipe issues have been fixed</b>
    The swipe glitches under background control mode are resolved — Simulation Room overclock, shops, and dispatch keepsakes now work correctly.
    On PC, collab minigames can only be controlled via the keyboard, so the game window is briefly brought to the foreground while they run.
- id: notice_202609012
  date: 2026-09-01
  title: 'PC client: new "Control scheme" option adds background control'
  type: info
  content: |
    <b>The PC client can now control the game window in the background</b>
    A new "Control scheme" option is available in PC Client settings, with two modes:
    - <b>pyautogui (foreground mode)</b>: the default. Simulates physical mouse input; clicks, scrolls and swipes take over the real mouse.
    - <b>postmessage (background mode)</b>: clicks, scrolls and swipes are delivered via window messages. The game window is not brought to the front and does not steal focus.

    <b>How to use</b>
    1. Go to NKAS → PC Client settings, set Screenshot method to PrintWindow and Control scheme to postmessage.
    2. The mouse cursor may briefly move during operations — this is expected.
    3. The launcher still relies on foreground operation and is not affected by the control scheme.

    <b>Known issues</b>
    Swipe-related:
    1. Simulation Room overclock cannot reroll traits.
    2. Any shop that involves scrolling may skip items.
    3. Dispatch keepsake switching does not select correctly.
    Other:
    1. Some scenarios that depend on DirectInput / Raw Input may not respond to background keyboard messages; foreground mode is still required in those cases.
- id: notice_20260829
  date: 2026-08-29
  title: Physical device (Android phone) support
  type: info
  content: |
    <b>NKAS now supports running against a physical device</b>
    Two setups are supported: NKAS on PC + game on a physical Android device, and NKAS on a physical Android device + game on a physical Android device.
    An APK is now available for quick installation of NKAS on Android; download it from the QQ group files.
    Thanks to community member @不会起名字 for the substantial help.

    For setup instructions see the guide: <a href="https://nkas.megumiss.top/wiki/#/zh-cn/Usage-Guide-Physical-Device" target="_blank">https://nkas.megumiss.top/wiki/#/zh-cn/Usage-Guide-Physical-Device</a>
- id: notice_20260822
  date: 2026-08-22
  title: Schedule settings (BETA)
  type: info
  content: |
    <b>New Schedule Settings page — manage every task's run time and enabled state in one place</b>
    Entry point: left task rail → Schedule settings (BETA).

    <b>What it does</b>
    Central view / editor for each task's schedule (daily / weekly / monthly), run time, and enabled toggle. Tick multiple tasks to batch-set their period and time; click a task name to jump straight to its settings page.

    <b>Recommended usage</b>
    Keep daily tasks on the same run time so they execute in priority order once the time hits. Splitting them across different times reorders execution and can miss reward windows; only add extra times for tasks you genuinely need to run multiple times per day.

    <b>Notes</b>
    This feature is in BETA; report any issues on <a href="https://github.com/megumiss/NIKKEAutoScript/issues" target="_blank">GitHub Issues</a>.
- id: notice_20260819
  date: 2026-08-19
  title: LiPass auto-login for Cookie retrieval
  type: info
  content: |
    <b>LiPass Cookie now supports one-click auto-login</b>
    No need to copy the Cookie manually: LiPass → Cookie → click "One-click login". The script performs the login automatically and fills in Cookie, XCommonParams and the Cookie expiry time for you.

    <b>Before you start</b>
    In NKAS Settings → Account Settings, fill in your LiPass account and password.

    <b>Notes</b>
    If a slider CAPTCHA appears during login, just drag across the image in the popup to solve it. On first use, playwright is installed automatically; if the machine has no Chrome/Edge, chromium is downloaded automatically. This also works inside Docker.
- id: notice_20260816
  date: 2026-08-16
  title: LiPass Cookie auto-renewal
  type: info
  content: |
    <b>LiPass Cookie now supports auto-renewal</b>
    Tasks renew the Cookie automatically before it expires — no manual refresh required.

    <b>How to enable</b>
    LiPass → Cookie → tick "Auto-renew (BETA)", and in NKAS Settings → Account Settings fill in your LiPass account (account only, no password needed).

    <b>Notes</b>
    Once the Cookie has actually expired it cannot be renewed, so keep tasks running normally. The first renewal installs playwright automatically; Docker users will additionally download chromium.
