# Announcement list; new announcements are appended to the top of the file
# Kamdzy - translated to English for en-US NKAS fork
- id: notice_202609012
  date: 2026-09-01
  title: 'PC client: new "Control scheme" option adds background control'
  type: info
  content: |
    <b>The PC client can now control the game window in the background</b>
    A new "Control scheme" option is available in PC Client settings, with two modes:
    - <b>pyautogui (foreground mode)</b>: the default. Simulates physical mouse input; clicks, scrolls and swipes take over the real mouse.
    - <b>postmessage (background mode)</b>: clicks, scrolls and swipes are delivered via window messages. The game window is not brought to the front and does not steal focus.

    <b>How to use</b>
    1. Go to NKAS → PC Client settings, set Screenshot method to PrintWindow and Control scheme to postmessage.
    2. The mouse cursor may briefly move during operations — this is expected.
    3. The launcher still relies on foreground operation and is not affected by the control scheme.

    <b>Known issues</b>
    Swipe-related:
    1. Simulation Room overclock cannot reroll traits.
    2. Any shop that involves scrolling may skip items.
    3. Dispatch keepsake switching does not select correctly.
    Other:
    1. Collab minigames depend on keyboard input and only work in foreground mode.
- id: notice_20260829
  date: 2026-08-29
  title: Physical device (Android phone) support
  type: info
  content: |
    <b>NKAS now supports running against a physical device</b>
    Two setups are supported: NKAS on PC + game on a physical Android device, and NKAS on a physical Android device + game on a physical Android device.
    Thanks to community member @不会起名字 for the substantial help.

    <b style="color:#e5484d;">⚠️ Risk warning: there have already been cases of temporary bans when using a physical device, cause unknown. Use it at your own risk.</b>

    For setup instructions see the guide: <a href="https://nkas.megumiss.top/wiki/#/zh-cn/Usage-Guide-Physical-Device" target="_blank">https://nkas.megumiss.top/wiki/#/zh-cn/Usage-Guide-Physical-Device</a>
- id: notice_20260828
  date: 2026-08-28
  title: "New option for 1080p screens: VDD virtual display"
  type: info
  content: |
    <b>1080p users no longer need "Rotate screen" — running the script on a VDD virtual display is now recommended</b>
    Virtual Display Driver creates a 1080x1920 virtual screen on your system. The game window runs in portrait on that virtual screen, your main display is completely unaffected, and the virtual screen can be switched off automatically when the script finishes.

    <b>Driver download</b>
    <a href="https://github.com/VirtualDrivers/Virtual-Display-Driver/releases" target="_blank">Virtual Display Driver GitHub Releases</a>
    Installing the setup package directly is recommended: Virtual.Display.Driver-vxx.xx.xx-setup-x64.exe

    <b>How to use</b>
    1. After installing the driver, open Windows display settings, select the new screen that appears, and set its resolution to 1920x1080 in portrait orientation.
    2. In NKAS go to PC client settings, enable "Multi-screen mode", click "Start virtual display", then pick the virtual screen under "Target screen for the game window".
    3. Tick "Is a VDD virtual display" and "Auto-manage VDD display" — the virtual screen is then enabled when a task starts and disabled when it finishes.
    4. The "Rotate screen" option previously needed for 1080p can now be turned off.
- id: notice_20260822
  date: 2026-08-22
  title: Schedule settings (BETA)
  type: info
  content: |
    <b>New Schedule Settings page — manage every task's run time and enabled state in one place</b>
    Entry point: left task rail → Schedule settings (BETA).

    <b>What it does</b>
    Central view / editor for each task's schedule (daily / weekly / monthly), run time, and enabled toggle. Tick multiple tasks to batch-set their period and time; click a task name to jump straight to its settings page.

    <b>Recommended usage</b>
    Keep daily tasks on the same run time so they execute in priority order once the time hits. Splitting them across different times reorders execution and can miss reward windows; only add extra times for tasks you genuinely need to run multiple times per day.

    <b>Notes</b>
    This feature is in BETA; report any issues on <a href="https://github.com/megumiss/NIKKEAutoScript/issues" target="_blank">GitHub Issues</a>.
- id: notice_20260819
  date: 2026-08-19
  title: LiPass auto-login for Cookie retrieval
  type: info
  content: |
    <b>LiPass Cookie now supports one-click auto-login</b>
    No need to copy the Cookie manually: LiPass → Cookie → click "One-click login". The script performs the login automatically and fills in Cookie, XCommonParams and the Cookie expiry time for you.

    <b>Before you start</b>
    In NKAS Settings → Account Settings, fill in your LiPass account and password.

    <b>Notes</b>
    If a slider CAPTCHA appears during login, just drag across the image in the popup to solve it. On first use, playwright is installed automatically; if the machine has no Chrome/Edge, chromium is downloaded automatically. This also works inside Docker.
- id: notice_20260816
  date: 2026-08-16
  title: LiPass Cookie auto-renewal
  type: info
  content: |
    <b>LiPass Cookie now supports auto-renewal</b>
    Tasks renew the Cookie automatically before it expires — no manual refresh required.

    <b>How to enable</b>
    LiPass → Cookie → tick "Auto-renew (BETA)", and in NKAS Settings → Account Settings fill in your LiPass account (account only, no password needed).

    <b>Notes</b>
    Once the Cookie has actually expired it cannot be renewed, so keep tasks running normally. The first renewal installs playwright automatically; Docker users will additionally download chromium.
