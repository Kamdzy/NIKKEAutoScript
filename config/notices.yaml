    <b>This story event uses new auto-push logic. Please report any issues.</b>
- id: notice_20260806
  date: 2026-08-06
  title: Major version update
  type: info
  content: |
    <b>The frontend has been fully rewritten; downloading the full package again is recommended.</b>
    <a href="https://github.com/megumiss/NIKKEAutoScript/releases/latest" target="_blank">GitHub Releases download page</a>

    <b>1. Users installing the fresh full package</b>
    Copy the old version's <code>config</code> folder into the new install to import your previous config and account data.

    <b>2. New anonymous usage statistics</b>
    On startup a random anonymous ID, source commit hash, platform name and screen resolution are reported (at most once per day). No account, config or personal data is collected.
    To disable: Deploy page → Statistics → EnableStatistics.

    <b>3. Reporting issues</b>
    If you hit problems with the new exe, please report them on <a href="https://github.com/megumiss/NIKKEAutoScript/issues" target="_blank">GitHub Issues</a> or in the <a href="https://qm.qq.com/q/ibQKuQI9Ko" target="_blank">QQ group</a>.
